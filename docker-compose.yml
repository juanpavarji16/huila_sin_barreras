services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hsb_db
    environment:
      POSTGRES_USER: hsb_user
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: huila_sin_barreras
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - hsb_data:/var/lib/postgresql/data
volumes:
  hsb_data:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
